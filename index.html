<html lang="ja">

    <style>
        body {

            background-color: #0f0f0f;
            color: #cfcfcf;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            width: 95%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #333;
        }
        h1 { font-size: 1.2rem; color: #aaa; margin-bottom: 20px; letter-spacing: 2px; }
        
        /* セレクト画面 */
        #mode-select { display: block; }
        .rarity-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: 0.3s;
        }
        .btn-star6 { background: linear-gradient(45deg, #ff9d00, #ff5e00); color: white; }
        .btn-star5 { background: linear-gradient(45deg, #db9dff, #9d00ff); color: white; }
        .rarity-btn:hover { opacity: 0.8; transform: scale(1.02); }

        /* クイズ画面 */
        #quiz-area { display: none; }
        .display-panel {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #222;
        }
        .label { color: #00aaff; font-size: 0.8rem; font-weight: bold; }
        .value { color: #fff; font-weight: bold; }
        .hidden-val { color: #333; }

        .answer-box {
            margin-top: 15px;
            height: 50px;
            font-size: 1.8rem;
            color: #ffcc00;
            font-weight: bold;
            text-align: center;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .hint-btn {
            padding: 12px 5px;
            background: #333;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .hint-btn:hover { background: #444; }
        .hint-btn:active { background: #00aaff; }

        .btn-reveal {
            grid-column: span 2;
            background: #4a3a00;
            color: #ffcc00;
            border: 1px solid #8a6d00;
            font-weight: bold;
        }
        .btn-control {
            grid-column: span 2;
            margin-top: 10px;
            padding: 12px;
            background: #005bb5;
            color: white;
            border: none;
            font-weight: bold;
        }
        .btn-back { background: #555; margin-top: 5px; }
    </style>
</head>

</div>

let currentPool = [];
let currentOp = {};

function startQuiz(rarity) {
    currentPool = operators.filter(op => op.rarity === rarity);
    document.getElementById('mode-select').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('quiz-title').innerText = `★${rarity} オペレータークイズ`;
    pickOperator();
}

function pickOperator() {
    currentOp = currentPool[Math.floor(Math.random() * currentPool.length)];
    
    // 表示リセット
    const keys = ['job', 'race', 'gender', 'block', 'limited', 'origin', 'weapon'];
    keys.forEach(k => {
        const el = document.getElementById('res-' + k);
        el.innerText = "？？？";
        el.classList.add('hidden-val');
    });
    document.getElementById('res-name').innerText = "";
}

function reveal(key) {
    if (key === 'name') {
        document.getElementById('res-name').innerText = currentOp.name;
    } else {
        const el = document.getElementById('res-' + key);
        el.innerText = currentOp[key];
        el.classList.remove('hidden-val');
    }
}

function backToMenu() {
    document.getElementById('mode-select').style.display = 'block';
    document.getElementById('quiz-area').style.display = 'none';
}
