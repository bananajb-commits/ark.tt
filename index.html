<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アークナイツ オペレーター診断</title>

<style>
:root {
    --star6-color: #ff9d00;
    --star6-glow: rgba(255, 157, 0, 0.5);
    --star5-color: #db9dff;
    --star5-glow: rgba(219, 157, 255, 0.5);
    --bg-dark: #0a0b0d;
    --panel-bg: rgba(20, 22, 26, 0.8);
    --accent-blue: #00e1ff;
}

body {
    font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background-color: var(--bg-dark);
    background-image:
        radial-gradient(circle at 50% 50%, #1a1f25 0%, #0a0b0d 100%),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    background-size: 100% 100%, 100% 4px, 3px 100%;
    color: #e0e0e0;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    min-height: 100dvh;
    margin: 0;
    overflow-y: auto;
}

.container {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
    width: 95%;
    max-width: 550px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    animation: fadeIn 0.8s ease-out;
    margin: 40px 0;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 1.4rem;
    letter-spacing: 4px;
    margin-bottom: 25px;
    color: #fff;
}

#mode-select { display: block; }
#quiz-area { display: none; }

.rarity-btn {
    display: block;
    width: 100%;
    padding: 25px;
    margin: 15px 0;
    font-size: 1.5rem;
    font-weight: 900;
    cursor: pointer;
    border-radius: 12px;
    border: none;
}

.btn-star6 {
    background: linear-gradient(135deg, #ff9d00, #ff5e00);
    color: #fff;
}

.btn-star5 {
    background: linear-gradient(135deg, #db9dff, #9d00ff);
    color: #fff;
}

.display-panel {
    background: rgba(0,0,0,0.6);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 25px;
    border-left: 4px solid var(--accent-blue);
    text-align: left;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.label {
    color: var(--accent-blue);
    font-size: 0.85rem;
    font-weight: bold;
}

.value {
    color: #fff;
    font-weight: bold;
}

.hidden-val {
    color: transparent;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 0 10px;
}

.answer-box {
    margin-top: 20px;
    height: 60px;
    font-size: 2.2rem;
    color: #ffcc00;
    font-weight: 900;
    text-align: center;
}

.button-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.hint-btn {
    padding: 14px;
    background: rgba(255,255,255,0.05);
    color: #aaa;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    cursor: pointer;
}

.btn-reveal {
    grid-column: span 2;
    background: rgba(255,204,0,0.1);
    color: #ffcc00;
    border: 1px solid #ffcc00;
}

.btn-control {
    grid-column: span 2;
    padding: 16px;
    background: #005bb5;
    color: white;
    border: none;
    font-weight: 900;
    font-size: 1.1rem;
    border-radius: 8px;
    cursor: pointer;
}

.btn-back {
    background: transparent;
    border: 1px solid #555;
    color: #888;
}

.theme-star6 { --accent-blue: var(--star6-color); }
.theme-star5 { --accent-blue: var(--star5-color); }
</style>
</head>

    </div>
</div>

   そのままコピペしても問題なくスクロールします ★★★ */

let currentPool = [];
let currentOp = {};

function startQuiz(rarity) {
    currentPool = operators[rarity];
    document.body.className = rarity === 6 ? 'theme-star6' : 'theme-star5';
    document.getElementById('mode-select').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('quiz-title').innerText = `★${rarity} オペレーター解析`;
    pickOperator();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pickOperator() {
    currentOp = currentPool[Math.floor(Math.random() * currentPool.length)];
    ['job','race','gender','block','limited','origin','weapon'].forEach(k=>{
        const el=document.getElementById('res-'+k);
        el.innerText="？？？";
        el.classList.add('hidden-val');
    });
    document.getElementById('res-name').innerText="";
}

function reveal(key) {
    if(key==='name'){
        document.getElementById('res-name').innerText=currentOp.name;
    } else {
        const el=document.getElementById('res-'+key);
        el.innerText=currentOp[key];
        el.classList.remove('hidden-val');
    }
}

function backToMenu(){
    document.body.className='';
    document.getElementById('mode-select').style.display='block';
    document.getElementById('quiz-area').style.display='none';
    window.scrollTo({ top: 0 });
}
</script>
